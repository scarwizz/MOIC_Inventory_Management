[project]
name = "moic-supply-chain-agent"
version = "1.0.0"
description = "Neuro-Symbolic Supply Chain Decision Agent using the MOIC framework, LightGBM surrogates, and LangGraph ReAct orchestration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.0",
    "langchain>=1.3.0",
    "langchain-core>=1.5.0",
    "langchain-groq>=1.1.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "tqdm>=4.66.0",
    "joblib>=1.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.30.0",
]
